# kANNolo-Rerank: HNSW over RaBitQ codes (first stage), rescored with f16 vectors.
# encoder_spec = [encoder, pq_subspaces, rabitq_total_bits, rabitq_query_bits]; 1-bit RaBitQ also sweeps
# the query width, which only the 1-bit encoder has. Search arguments are positional, in this order.
float:
  any:
    - base_args: ['@metric']
      constructor: KannoloRerank
      disabled: false
      singularity_image: kannolo_rerank
      module: vibe.algorithms.kannolo_rerank
      name: kannolo-rerank
      run_groups:
        rabitq-1bit:
          arg_groups:
            - [16, 32, 64]
            - [200, 500]
            - [permuted]
            - - [rabitq, 128, 4, 1]
          query_args:
            k_candidates: [20, 30, 50, 100]
            ef_multiplier: [1.0, 1.25, 1.5]
            alpha: [null, 0.05, 0.1, 0.15]
            early_exit_threshold: [null, 0.01, 0.04, 0.08, 0.12, 0.16]
            query_bits: [1, 2, 4]
        rabitq-ext:
          arg_groups:
            - [16, 32, 64]
            - [200, 500]
            - [permuted]
            - - [rabitq-ext, 128, 2, 1]
              - [rabitq-ext, 128, 4, 1]
          query_args:
            k_candidates: [20, 30, 50, 100]
            ef_multiplier: [1.0, 1.25, 1.5]
            alpha: [null, 0.05, 0.1, 0.15]
            early_exit_threshold: [null, 0.01, 0.04, 0.08, 0.12, 0.16]

# VIBE upstream grid. Upstream's beam_size ladder starts at 100 = k for its default k=100; at k=10 the
# same ladder rescaled to k=10 is added in front of it (all upstream values are kept).
float:
  any:
  - base_args: ['@metric']
    constructor: SymphonyQG
    disabled: false
    singularity_image: symphonyqg
    module: vibe.algorithms.symphonyqg
    name: symphonyqg
    run_groups:
      symphonyqg:
        args:
          degree_bound: [32, 64, 96, 128]
          EF: [400]
          num_iter: [3]
        query_args:
          beam_size: [10, 15, 20, 25, 30, 40, 50, 60, 70, 80,
                      100, 150, 200, 250, 300, 400, 500, 600, 700, 800, 1000, 1500, 2000]
